<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Contact - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section">
        <h1 id="contact-heading">Contact</h1>
        <p id="contact-intro">Have a question about a model, a commission idea, or a custom order? Send us a message below.</p>

        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="68f12a2d-6dbc-437f-987c-37d801320465">
            <input type="hidden" name="redirect" value="https://www.honeycat3d.com/thank-you.html">
            <input type="hidden" id="model-field" name="model" value="">
            <input type="hidden" id="model-id-field" name="model_id" value="">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const modelName = params.get("model");

        if (modelName) {
            document.getElementById("contact-heading").textContent = "Custom Order Request";
            document.getElementById("contact-intro").textContent =
                `You're requesting a custom order/print of "${modelName}". Add any details below (color, size, finish) and we'll get back to you.`;
            document.getElementById("model-field").value = modelName;
            document.getElementById("model-id-field").value = params.get("id") || "";
            document.getElementById("message").value =
                `Hi, I'd like to request a custom order/print of the "${modelName}" model.\n\nDetails:\n- `;
        }
    </script>

</body>
</html>
