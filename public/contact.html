<head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>

                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>

    </header>

    <section class="section">
        <h1>Contact</h1>
        <p>Have a question about a model, a commission idea, or a custom order? Send us a message below.</p>

        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="68f12a2d-6dbc-437f-987c-37d801320465">
            <input type="hidden" name="redirect" value="https://www.honeycat3d.com/thank-you.html">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

</body>
