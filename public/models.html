<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Available Models - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section section-wide">
        <h1>Available Models</h1>

        <div class="browse-layout">
            <aside class="browse-sidebar">
                <div class="sidebar-block">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" placeholder="Search models...">
                </div>

                <div class="sidebar-block">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="title-desc">Title (Z-A)</option>
                        <option value="artist-asc">Artist (A-Z)</option>
                    </select>
                </div>

                <div class="sidebar-block">
                    <span class="sidebar-heading">Artist</span>
                    <div id="artist-checkboxes" class="checkbox-list"></div>
                </div>

                <div class="sidebar-block">
                    <span class="sidebar-heading">Series</span>
                    <div id="series-checkboxes" class="checkbox-list"></div>
                </div>
            </aside>

            <div class="browse-main">
                <p class="results-count" id="results-count"></p>
                <div class="grid" id="models-grid"></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script src="models-data.js?v=11"></script>
    <script>
        const grid = document.getElementById("models-grid");
        const resultsCount = document.getElementById("results-count");
        const searchInput = document.getElementById("search-input");
        const sortSelect = document.getElementById("sort-select");
        const artistBox = document.getElementById("artist-checkboxes");
        const seriesBox = document.getElementById("series-checkboxes");
        const pagination = document.getElementById("pagination");

        const PAGE_SIZE = 60;
        let filteredModels = [];
        let currentPage = 1;

        function buildCheckboxes(container, valueCounts, groupName) {
            valueCounts.forEach(({ value, count }) => {
                const id = groupName + "-" + value.replace(/\s+/g, "-").toLowerCase();
                const wrapper = document.createElement("label");
                wrapper.className = "checkbox-item";
                wrapper.innerHTML = `
                    <input type="checkbox" value="${value}" id="${id}" data-group="${groupName}">
                    ${value}
                    <span class="checkbox-count">${count}</span>
                `;
                container.appendChild(wrapper);
            });
        }

        function getChecked(container) {
            return Array.from(container.querySelectorAll("input:checked")).map(cb => cb.value);
        }

        function applyFilters() {
            const query = searchInput.value.trim().toLowerCase();
            const checkedArtists = getChecked(artistBox);
            const checkedSeries = getChecked(seriesBox);
            const sortMode = sortSelect.value;

            filteredModels = MODELS.filter(m => {
                const matchesQuery = m.title.toLowerCase().includes(query);
                const matchesArtist = checkedArtists.length === 0 || checkedArtists.includes(m.artist);
                const matchesSeries = checkedSeries.length === 0 || checkedSeries.includes(m.series);
                return matchesQuery && matchesArtist && matchesSeries;
            });

            filteredModels.sort((a, b) => {
                if (sortMode === "title-asc") return a.title.localeCompare(b.title);
                if (sortMode === "title-desc") return b.title.localeCompare(a.title);
                if (sortMode === "artist-asc") return a.artist.localeCompare(b.artist);
                return 0;
            });

            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const totalPages = Math.max(1, Math.ceil(filteredModels.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filteredModels.slice(start, start + PAGE_SIZE);
            const rangeStart = filteredModels.length === 0 ? 0 : start + 1;
            const rangeEnd = start + pageItems.length;

            resultsCount.textContent = `Showing ${rangeStart}-${rangeEnd} of ${filteredModels.length} models`;

            grid.innerHTML = pageItems.map(m => `
                <div class="card">
                    <a href="model.html?id=${m.id}">
                        <img src="${m.images[0]}" alt="${m.title}" loading="lazy">
                    </a>
                    <h3>${m.title}</h3>
                    <p class="card-series">${m.series}</p>
                    <p class="card-artist">by ${m.artist}</p>
                    <a class="btn" href="model.html?id=${m.id}">View Details</a>
                </div>
            `).join("");

            if (filteredModels.length === 0) {
                grid.innerHTML = "<p>No models match those filters.</p>";
            }

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                pagination.innerHTML = "";
                return;
            }

            const prevDisabled = currentPage === 1 ? "btn-disabled" : "";
            const nextDisabled = currentPage === totalPages ? "btn-disabled" : "";

            pagination.innerHTML = `
                <a href="#" class="btn ${prevDisabled}" id="page-prev">&laquo; Prev</a>
                <span class="pagination-status">Page ${currentPage} of ${totalPages}</span>
                <a href="#" class="btn ${nextDisabled}" id="page-next">Next &raquo;</a>
            `;

            const prevBtn = document.getElementById("page-prev");
            const nextBtn = document.getElementById("page-next");
            if (currentPage > 1) {
                prevBtn.addEventListener("click", (e) => { e.preventDefault(); goToPage(currentPage - 1); });
            }
            if (currentPage < totalPages) {
                nextBtn.addEventListener("click", (e) => { e.preventDefault(); goToPage(currentPage + 1); });
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderPage();
            document.querySelector(".browse-main").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function countBy(key) {
            const counts = {};
            MODELS.forEach(m => {
                counts[m[key]] = (counts[m[key]] || 0) + 1;
            });
            return Object.keys(counts)
                .sort()
                .map(value => ({ value, count: counts[value] }));
        }

        const artistCounts = countBy("artist");
        const seriesCounts = countBy("series");
        buildCheckboxes(artistBox, artistCounts, "artist");
        buildCheckboxes(seriesBox, seriesCounts, "series");

        searchInput.addEventListener("input", applyFilters);
        sortSelect.addEventListener("change", applyFilters);
        artistBox.addEventListener("change", applyFilters);
        seriesBox.addEventListener("change", applyFilters);

        applyFilters();
    </script>

</body>
</html>
