<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Available Models - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section section-wide">
        <h1>Available Models</h1>

        <div class="browse-layout">
            <aside class="browse-sidebar">
                <div class="sidebar-block">
                    <label for="search-input">Search</label>
                    <input type="text" id="search-input" placeholder="Search models...">
                </div>

                <div class="sidebar-block">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="title-desc">Title (Z-A)</option>
                        <option value="artist-asc">Artist (A-Z)</option>
                    </select>
                </div>

                <div class="sidebar-block">
                    <span class="sidebar-heading">Artist</span>
                    <div id="artist-checkboxes" class="checkbox-list"></div>
                </div>

                <div class="sidebar-block">
                    <span class="sidebar-heading">Series</span>
                    <div id="series-checkboxes" class="checkbox-list"></div>
                </div>
            </aside>

            <div class="browse-main">
                <p class="results-count" id="results-count"></p>
                <div class="grid" id="models-grid"></div>
            </div>
        </div>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script src="models-data.js?v=7"></script>
    <script>
        const grid = document.getElementById("models-grid");
        const resultsCount = document.getElementById("results-count");
        const searchInput = document.getElementById("search-input");
        const sortSelect = document.getElementById("sort-select");
        const artistBox = document.getElementById("artist-checkboxes");
        const seriesBox = document.getElementById("series-checkboxes");

        function buildCheckboxes(container, valueCounts, groupName) {
            valueCounts.forEach(({ value, count }) => {
                const id = groupName + "-" + value.replace(/\s+/g, "-").toLowerCase();
                const wrapper = document.createElement("label");
                wrapper.className = "checkbox-item";
                wrapper.innerHTML = `
                    <input type="checkbox" value="${value}" id="${id}" data-group="${groupName}">
                    ${value}
                    <span class="checkbox-count">${count}</span>
                `;
                container.appendChild(wrapper);
            });
        }

        function getChecked(container) {
            return Array.from(container.querySelectorAll("input:checked")).map(cb => cb.value);
        }

        function renderModels() {
            const query = searchInput.value.trim().toLowerCase();
            const checkedArtists = getChecked(artistBox);
            const checkedSeries = getChecked(seriesBox);
            const sortMode = sortSelect.value;

            let filtered = MODELS.filter(m => {
                const matchesQuery = m.title.toLowerCase().includes(query);
                const matchesArtist = checkedArtists.length === 0 || checkedArtists.includes(m.artist);
                const matchesSeries = checkedSeries.length === 0 || checkedSeries.includes(m.series);
                return matchesQuery && matchesArtist && matchesSeries;
            });

            filtered.sort((a, b) => {
                if (sortMode === "title-asc") return a.title.localeCompare(b.title);
                if (sortMode === "title-desc") return b.title.localeCompare(a.title);
                if (sortMode === "artist-asc") return a.artist.localeCompare(b.artist);
                return 0;
            });

            resultsCount.textContent = `Showing ${filtered.length} of ${MODELS.length} models`;

            grid.innerHTML = filtered.map(m => `
                <div class="card">
                    <a href="model.html?id=${m.id}">
                        <img src="${m.images[0]}" alt="${m.title}">
                    </a>
                    <h3>${m.title}</h3>
                    <p class="card-artist">by ${m.artist}</p>
                    <a class="btn" href="model.html?id=${m.id}">View Details</a>
                </div>
            `).join("");

            if (filtered.length === 0) {
                grid.innerHTML = "<p>No models match those filters.</p>";
            }
        }

        function countBy(key) {
            const counts = {};
            MODELS.forEach(m => {
                counts[m[key]] = (counts[m[key]] || 0) + 1;
            });
            return Object.keys(counts)
                .sort()
                .map(value => ({ value, count: counts[value] }));
        }

        const artistCounts = countBy("artist");
        const seriesCounts = countBy("series");
        buildCheckboxes(artistBox, artistCounts, "artist");
        buildCheckboxes(seriesBox, seriesCounts, "series");

        searchInput.addEventListener("input", renderModels);
        sortSelect.addEventListener("change", renderModels);
        artistBox.addEventListener("change", renderModels);
        seriesBox.addEventListener("change", renderModels);

        renderModels();
    </script>

</body>
</html>
