<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Model - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section" id="model-detail">
        <p>Loading model...</p>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script src="models-data.js?v=21"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const modelId = params.get("id");
        const model = MODELS.find(m => m.id === modelId);
        const container = document.getElementById("model-detail");

        if (!model) {
            container.innerHTML = "<p>Model not found. <a href='models.html'>Back to Available Models</a></p>";
        } else {
            document.title = model.title + " - HoneyCat3D";

            container.innerHTML = `
                <a class="back-link" href="models.html">&larr; Back to Available Models</a>

                <div class="product-layout">
                    <div class="model-gallery">
                        <div class="main-image-wrap">
                            <button class="gallery-arrow gallery-arrow-left" id="prev-image" aria-label="Previous image">&#10094;</button>
                            <img id="main-image" src="${model.images[0]}" alt="${model.title}" fetchpriority="high">
                            <button class="gallery-arrow gallery-arrow-right" id="next-image" aria-label="Next image">&#10095;</button>
                        </div>
                        <div class="thumbnail-row">
                            ${model.images.map((img, i) => `
                                <img class="thumbnail ${i === 0 ? "active" : ""}" src="${img}" alt="${model.title} view ${i + 1}" loading="lazy">
                            `).join("")}
                        </div>
                    </div>

                    <div class="product-info">
                        <p class="product-meta">
                            <a href="models.html?artist=${encodeURIComponent(model.artist)}">${model.artist}</a>
                            &middot;
                            <a href="models.html?series=${encodeURIComponent(model.series)}">${model.series}</a>
                        </p>
                        <h1>${model.title}</h1>

                        <div class="model-specs">
                            <label for="scale-select"><strong>Scale:</strong></label>
                            <select id="scale-select">
                                ${model.scaleOptions.map((opt, i) => `
                                    <option value="${i}">${opt.scale}</option>
                                `).join("")}
                            </select>

                            <p id="size-display"><strong>Size:</strong> ${model.scaleOptions[0].size}</p>
                            <p>${model.description}</p>
                        </div>

                        <div id="etsy-link-wrap"></div>
                        <a class="btn btn-secondary" href="contact.html">Interested in a Custom Order? Contact Us</a>
                    </div>
                </div>

                <div class="lightbox" id="lightbox">
                    <img id="lightbox-image" src="" alt="${model.title} enlarged">
                </div>

                <div id="related-section"></div>
            `;

            function getRelatedModels() {
                const RELATED_COUNT = 4;
                const sameSeries = MODELS.filter(m => m.id !== model.id && m.series === model.series);
                const sameArtist = MODELS.filter(m => m.id !== model.id && m.artist === model.artist && m.series !== model.series);

                const related = [...sameSeries, ...sameArtist].slice(0, RELATED_COUNT);
                return related;
            }

            function renderRelated() {
                const related = getRelatedModels();
                const relatedSection = document.getElementById("related-section");
                if (related.length === 0) {
                    relatedSection.innerHTML = "";
                    return;
                }

                relatedSection.innerHTML = `
                    <div class="section related-models">
                        <h2>You Might Also Like</h2>
                        <div class="grid">
                            ${related.map(m => `
                                <div class="card">
                                    <a href="model.html?id=${m.id}">
                                        <img src="${m.images[0]}" alt="${m.title}" loading="lazy">
                                    </a>
                                    <h3>${m.title}</h3>
                                    <p class="card-series">${m.series}</p>
                                    <p class="card-artist">by ${m.artist}</p>
                                    <a class="btn" href="model.html?id=${m.id}">View Details</a>
                                </div>
                            `).join("")}
                        </div>
                    </div>
                `;
            }

            renderRelated();

            function renderEtsyButton(url) {
                if (url === "LINK_GOES_HERE") {
                    return `<span class="btn btn-disabled">Coming Soon</span>`;
                }
                return `<a class="btn" href="${url}" target="_blank">View on Etsy</a>`;
            }

            document.getElementById("etsy-link-wrap").innerHTML = renderEtsyButton(model.scaleOptions[0].etsyUrl);

            const mainImage = document.getElementById("main-image");
            const thumbnails = document.querySelectorAll(".thumbnail");
            const lightbox = document.getElementById("lightbox");
            const lightboxImage = document.getElementById("lightbox-image");
            let currentIndex = 0;

            function showImage(index) {
                currentIndex = (index + model.images.length) % model.images.length;
                mainImage.src = model.images[currentIndex];
                thumbnails.forEach(t => t.classList.remove("active"));
                thumbnails[currentIndex].classList.add("active");
                thumbnails[currentIndex].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
                if (lightbox.classList.contains("open")) {
                    lightboxImage.src = model.images[currentIndex];
                }
            }

            function openLightbox() {
                lightboxImage.src = model.images[currentIndex];
                lightbox.classList.add("open");
            }

            function closeLightbox() {
                lightbox.classList.remove("open");
            }

            thumbnails.forEach((thumb, i) => {
                thumb.addEventListener("click", () => showImage(i));
            });

            document.getElementById("prev-image").addEventListener("click", () => showImage(currentIndex - 1));
            document.getElementById("next-image").addEventListener("click", () => showImage(currentIndex + 1));

            mainImage.addEventListener("click", openLightbox);
            lightbox.addEventListener("click", closeLightbox);

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") showImage(currentIndex - 1);
                if (e.key === "ArrowRight") showImage(currentIndex + 1);
                if (e.key === "Escape") closeLightbox();
            });

            document.getElementById("scale-select").addEventListener("change", (e) => {
                const opt = model.scaleOptions[e.target.value];
                document.getElementById("size-display").innerHTML = `<strong>Size:</strong> ${opt.size}`;
                document.getElementById("etsy-link-wrap").innerHTML = renderEtsyButton(opt.etsyUrl);
            });
        }
    </script>

</body>
</html>
