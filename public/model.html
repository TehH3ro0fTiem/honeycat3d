<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Model - HoneyCat3D</title>
</head>

<body>

    <header>
        <nav>
            <div>
                <strong class="gold">HoneyCat3D</strong>
            </div>

            <div class="links">
                <a href="index.html">Home</a>
                <a href="models.html">Available Models</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact Us</a>
                <a href="https://www.etsy.com/shop/HoneyCat3D" target="_blank">Shop on Etsy</a>
            </div>
        </nav>
    </header>

    <section class="section" id="model-detail">
        <p>Loading model...</p>
    </section>

    <div class="footer">
        © HoneyCat3D • Premium Resin Collectibles
    </div>

    <script src="models-data.js?v=33"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const modelId = params.get("id");
        const model = MODELS.find(m => m.id === modelId);
        const container = document.getElementById("model-detail");

        if (!model) {
            container.innerHTML = "<p>Model not found. <a href='models.html'>Back to Available Models</a></p>";
        } else {
            document.title = model.title + " - HoneyCat3D";

            // A model with multiple sculpted versions (different outfit/pose/etc.) can carry a
            // `variants` array: [{ label, images, scaleOptions, description? }, ...]. A model with
            // no `variants` behaves exactly as before, using its own images/scaleOptions/description
            // as the single implicit "variant".
            const hasVariants = Array.isArray(model.variants) && model.variants.length > 0;
            let variantIndex = 0;

            function getVariant() {
                return hasVariants ? model.variants[variantIndex] : model;
            }

            const initialVariant = getVariant();

            container.innerHTML = `
                <a class="back-link" href="models.html">&larr; Back to Available Models</a>

                <div class="product-layout">
                    <div class="model-gallery">
                        <div class="main-image-wrap">
                            <button class="gallery-arrow gallery-arrow-left" id="prev-image" aria-label="Previous image">&#10094;</button>
                            <img id="main-image" src="${initialVariant.images[0]}" alt="${model.title}">
                            <button class="gallery-arrow gallery-arrow-right" id="next-image" aria-label="Next image">&#10095;</button>
                        </div>
                        <div class="thumbnail-row" id="thumbnail-row"></div>
                    </div>

                    <div class="product-info">
                        <p class="product-meta">${model.artist} &middot; ${model.series}</p>
                        <h1>${model.title}</h1>

                        <div class="model-specs">
                            ${hasVariants ? `
                                <label for="variant-select"><strong>Version:</strong></label>
                                <select id="variant-select">
                                    ${model.variants.map((v, i) => `
                                        <option value="${i}">${v.label}</option>
                                    `).join("")}
                                </select>
                            ` : ""}

                            <label for="scale-select"><strong>Scale:</strong></label>
                            <select id="scale-select"></select>

                            <p id="size-display"></p>
                            <p id="description-display"></p>
                        </div>

                        <p class="render-note">Photos shown are digital renders${model.paintedPhotos ? "" : " (unless noted otherwise)"} — the final painted piece may vary slightly from the images.</p>

                        <div id="etsy-link-wrap"></div>

                        <a class="btn btn-outline" id="custom-order-link" href="#">Contact Us to Custom Order/Print This Model</a>
                    </div>
                </div>

                <div class="lightbox" id="lightbox">
                    <img id="lightbox-image" src="" alt="${model.title} enlarged">
                </div>
            `;

            function renderEtsyButton(url) {
                if (url === "LINK_GOES_HERE") {
                    return `<span class="btn btn-disabled">Coming Soon</span>`;
                }
                return `<a class="btn" href="${url}" target="_blank">View on Etsy</a>`;
            }

            const mainImage = document.getElementById("main-image");
            const thumbnailRow = document.getElementById("thumbnail-row");
            const lightbox = document.getElementById("lightbox");
            const lightboxImage = document.getElementById("lightbox-image");
            const scaleSelect = document.getElementById("scale-select");
            const sizeDisplay = document.getElementById("size-display");
            const descriptionDisplay = document.getElementById("description-display");
            const etsyLinkWrap = document.getElementById("etsy-link-wrap");
            const customOrderLink = document.getElementById("custom-order-link");

            let currentImages = [];
            let currentIndex = 0;
            let thumbnails = [];

            function renderThumbnails(images) {
                thumbnailRow.innerHTML = images.map((img, i) => `
                    <img class="thumbnail ${i === 0 ? "active" : ""}" src="${img}" alt="${model.title} view ${i + 1}">
                `).join("");
                thumbnails = Array.from(thumbnailRow.querySelectorAll(".thumbnail"));
                thumbnails.forEach((thumb, i) => {
                    thumb.addEventListener("click", () => showImage(i));
                });
            }

            function showImage(index) {
                currentIndex = (index + currentImages.length) % currentImages.length;
                mainImage.src = currentImages[currentIndex];
                thumbnails.forEach(t => t.classList.remove("active"));
                thumbnails[currentIndex].classList.add("active");
                thumbnails[currentIndex].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
                if (lightbox.classList.contains("open")) {
                    lightboxImage.src = currentImages[currentIndex];
                }
            }

            function openLightbox() {
                lightboxImage.src = currentImages[currentIndex];
                lightbox.classList.add("open");
            }

            function closeLightbox() {
                lightbox.classList.remove("open");
            }

            function renderScaleOptions(variant) {
                scaleSelect.innerHTML = variant.scaleOptions.map((opt, i) => `
                    <option value="${i}">${opt.scale}</option>
                `).join("");
                scaleSelect.value = "0";
                sizeDisplay.innerHTML = `<strong>Size:</strong> ${variant.scaleOptions[0].size}`;
                etsyLinkWrap.innerHTML = renderEtsyButton(variant.scaleOptions[0].etsyUrl);
            }

            function updateCustomOrderLink(variant) {
                const label = hasVariants ? `${model.title} - ${variant.label}` : model.title;
                customOrderLink.href = `contact.html?model=${encodeURIComponent(label)}`;
            }

            function applyVariant(variant) {
                currentImages = variant.images;
                currentIndex = 0;
                renderThumbnails(currentImages);
                mainImage.src = currentImages[0];
                descriptionDisplay.textContent = variant.description || model.description;
                renderScaleOptions(variant);
                updateCustomOrderLink(variant);
            }

            applyVariant(initialVariant);

            if (hasVariants) {
                document.getElementById("variant-select").addEventListener("change", (e) => {
                    variantIndex = parseInt(e.target.value, 10);
                    applyVariant(getVariant());
                });
            }

            document.getElementById("prev-image").addEventListener("click", () => showImage(currentIndex - 1));
            document.getElementById("next-image").addEventListener("click", () => showImage(currentIndex + 1));

            mainImage.addEventListener("click", openLightbox);
            lightbox.addEventListener("click", closeLightbox);

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") showImage(currentIndex - 1);
                if (e.key === "ArrowRight") showImage(currentIndex + 1);
                if (e.key === "Escape") closeLightbox();
            });

            scaleSelect.addEventListener("change", (e) => {
                const variant = getVariant();
                const opt = variant.scaleOptions[e.target.value];
                sizeDisplay.innerHTML = `<strong>Size:</strong> ${opt.size}`;
                etsyLinkWrap.innerHTML = renderEtsyButton(opt.etsyUrl);
            });
        }
    </script>

</body>
</html>
